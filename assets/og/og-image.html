<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    width: 1200px;
    height: 630px;
    background: #05161A;
    background-image:
      radial-gradient(circle at 82% 18%, rgba(15,146,151,0.38), transparent 45%),
      radial-gradient(circle at 12% 92%, rgba(15,146,151,0.20), transparent 40%);
    color: #F5F7F8;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px 100px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 40%, black, transparent 85%);
  }
  .logo {
    font-size: 34px; font-weight: 800; letter-spacing: 1px;
    color: #fff; margin-bottom: 40px; position: relative;
  }
  .logo .dot { color: #0F9297; }
  .eyebrow {
    display: inline-block;
    font-size: 22px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: #0F9297;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 96px; font-weight: 700; line-height: 1.02;
    letter-spacing: -2px; margin-bottom: 26px; position: relative;
  }
  h1 span { color: #0F9297; }
  .subtitle {
    font-size: 40px; font-weight: 500; color: #F5F7F8; margin-bottom: 14px;
  }
  .location {
    font-size: 26px; color: #B8C8CB; margin-bottom: 44px;
  }
  .stack { display: flex; gap: 14px; flex-wrap: wrap; }
  .badge {
    font-size: 24px; font-weight: 500;
    padding: 12px 26px; border-radius: 999px;
    border: 1px solid rgba(15,146,151,0.55);
    background: rgba(15,146,151,0.12);
    color: #d7f2f2;
  }
  .domain {
    position: absolute; bottom: 30px; right: 100px;
    font-size: 26px; font-weight: 600; color: #7fb8bb;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="logo">CL<span class="dot">.</span></div>
  <span class="eyebrow">Portfolio</span>
  <h1>Clément <span>Lequeurre</span></h1>
  <div class="subtitle">Développeur Full-Stack</div>
  <div class="location">Blois, France</div>
  <div class="stack">
    <span class="badge">React</span>
    <span class="badge">Next.js</span>
    <span class="badge">PHP</span>
    <span class="badge">Symfony</span>
    <span class="badge">Laravel</span>
    <span class="badge">MySQL</span>
  </div>
  <div class="domain">clementlequeurre.com</div>
</body>
</html>
